[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "retentionengine"
version = "0.0.1"
description = "Trim layers of pretrained Transformer models and restore their quality with knowledge distillation."
readme = "README.md"
requires-python = ">=3.10, <3.14"
license = {file = "LICENSE"}
authors = [
    {name = "RetentionLabs", email = "retentionlabs.ai@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "torch>=2.0.0",
    "transformers>=4.51"
]

[project.optional-dependencies]
train = [
    "datasets",
    "wandb",
    "accelerate>=0.26.0",
]
fp8 = [
    "transformer-engine[pytorch]",
]
datagen = [
    "json-repair",
    # scripts/dataset_generator.py loads the model with device_map="auto".
    "accelerate>=0.26.0",
]
# Titans memory-module integration is planned; nothing in the package imports thelethe yet.
titans = [
    "thelethe @ git+https://github.com/retentionlabs/theRiverLethe@4e2d3f659bfaf111db75345f13271d6afc899267",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
]

# Installed by `uv run` / `uv sync` by default; enough to run the CPU smoke tests.
[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "accelerate>=0.26.0",
    "datasets",
    "json-repair",
]

[tool.uv]
# thelethe (`titans` extra) requires a transformers git fork. Without this override the
# uv lock would put every environment on that fork; keep the trimming/KD path on PyPI
# transformers. pip ignores this table.
override-dependencies = ["transformers>=4.51"]

[project.urls]
"Homepage" = "https://github.com/retentionlabs/retentionengine"
"Bug Tracker" = "https://github.com/retentionlabs/retentionengine/issues"
"Documentation" = "https://retentionlabs.github.io/"

[tool.flit.module]
name = "retentionengine"

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
